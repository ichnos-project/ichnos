name: Lab gha cache

on:
  pull_request:
    paths: ['.github/workflows/lab-gha.yml']

permissions: {}

jobs:
  record:
    name: Record
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      BUILDX_METADATA_PROVENANCE: disabled
      MODE: import
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          version: v0.38.1
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          file: lab/gha/Dockerfile
          outputs: type=cacheonly
          cache-from: ${{ env.MODE == 'import' && 'type=gha,scope=lab' || env.MODE == 'import-empty' && 'type=gha,scope=lab-empty' || '' }}
          cache-to: ${{ env.MODE == 'export' && 'type=gha,scope=lab,mode=max' || '' }}
      - name: Export the record
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          ref=$(jq -r '."buildx.build.ref"' <<<"$METADATA")
          docker buildx history export --builder "$BUILDER" --finalize "${ref##*/}" -o full.dockerbuild
      - name: Remove the trace and check for secrets
        run: lab/gha/reduce-record.sh full.dockerbuild record.dockerbuild
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-${{ env.MODE }}-${{ github.run_id }}
          path: record.dockerbuild
          retention-days: 1
          if-no-files-found: error
